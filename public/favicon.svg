
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bar-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#E1E1E1"/>
    </linearGradient>
  </defs>

  <!-- Black rounded-square background -->
  <rect
    x="5"
    y="5"
    width="502"
    height="502"
    rx="98"
    fill="#000000"
  />

  <!-- Three centered ascending bars -->
  <g fill="url(#bar-gradient)">
    <rect x="143.5" y="243.5" width="58" height="148.5" rx="17.5"/>
    <rect x="227.5" y="187" width="59" height="188" rx="17.5"/>
    <rect x="310.5" y="127.5" width="58" height="222.5" rx="17.5"/>
  </g>
</svg>
